<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENT A CAR</title>
</head>
<body>
    <div id="item1">
        <div id="main-div">
            
            <div id="text1">
                <h2>
                    Update Reservation
                </h2>
            </div>
            <div id="info-div">   
                <div id="car-info">
    
                    <div id="car-image">
                        <img src="images/car1.png" alt="Car Image">
                    </div>
    
                    <div class="input-container">
                        <label for="car-name">Car Name: </label>
                        dbden çekilecek
                    </div>
                    <div class="input-container">
                        <label for="car-rent-date">Rent Date: </label>
                        dbden çekilecek
                    </div>
                    <div class="input-container">
                        <label for="car-return-date">Return Date: </label>
                        dbden çekilecek
                    </div>
                </div>     
            </div>


            <div id="search-bar">
                <label for="car-rent-start-date-update">New Start Date</label><!-- buraya Javascript kodu gelecek o günün tarihini min olarak vericek-->
                <input type="date" name="car-rent-start-date-update" id="car-rent-start-date-update">
                <label for="car-rent-end-date-update">New End Date</label><!-- buraya Javascript kodu gelecek o günün tarihini min olarak vericek-->
                <input type="date" name="car-rent-end-date-update" id="car-rent-end-date-update">
                <button>Update</button>
            </div>

            
        </div>
    </div>
</body>
</html>
