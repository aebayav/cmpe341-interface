<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="styles.css">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            RENT A CAR
        </title>
    </head>

    <body>
        <div id="item1">
            <div id="main-div">
                <div id="text1">
                    <h2>Make A Reservation</h2>
                </div>

                <div id="search-bar">
                    <label for="car-rent-start-date">Start Date</label><!-- buraya Javascript kodu gelecek o günün tarihini min olarak vericek-->
                    <input type="date" name="car-rent-start-date" id="car-rent-start-date" required>
                    <label for="car-rent- end-date">End Date</label><!-- buraya Javascript kodu gelecek o günün tarihini min olarak vericek-->
                    <input type="date" name="car-rent-end-date" id="car-rent-end-date" required>
                    <label for="car-insurance-type"></label>
                    <button id="submit-button" type="submit" onclick="window.location.href = 'search-page.html'">Search</button>
                    
                </div>

                <div id="text1">
                    <h4>User Actions</h4>
                </div>

                <div id="user-actions">
                    <button onclick="window.location.href = 'update-page.html'">Update Reservation</button>
                    <button onclick="window.location.href = 'delete-page.html'">Cancel Reservation</button>
                </div>

            </div>
        </div>
        <script src="scripts/home-page.js"></script>
    </body>
    

</html>
