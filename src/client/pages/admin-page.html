<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENT A CAR</title>
</head>
<body>
    <div id="item1">
        <div id="main-div">

            <div id="text1">
                <h3>Admin Actions</h3>
            </div>
            
            <div id="car-list">
                <ul id = "car-ul">
                    <li>
                        <span>Car 1 bilgi </span>
                        <button class="admin-button" onclick="deleteCar(1)">Delete</button>
                    </li>
                    <li>
                        <span>Car 2</span>
                        <button class="admin-button" onclick="deleteCar(2)">Delete</button>
                    </li>
                    <li>
                        <span>Car 3</span>
                        <button class="admin-button" onclick="deleteCar(3)">Delete</button>
                    </li>
                    <li>
                        <span>Car 4</span>
                        <button class="admin-button" onclick="deleteCar(4)">Delete</button>
                    </li>
                    <!-- Add more cars here as needed -->
                </ul>
            </div>

            <div id="text1">
                <h3>Adding a Car</h3>
        </div>

        <div id="adding-car">
            <form id="add-car-form">
                <label for="carid">Car ID:</label>
                <input type="number" id="carid" name="carid" required><br>

                <label for="brand">Car Brand:</label>
                <input type="text" id="brand" name="brand" required><br>
                
                
                
                <label for="carmodel">Car Model:</label>
                <input type="text" id="carmodel" name="carmodel" required><br>
                
                <label for="caryear">Car Year:</label>
                <input type="number" id="caryear" name="caryear" required><br>
                
                <label for="rentalrate">Rental Rate:</label>
                <input type="number" id="rentalrate" name="rentalrate" step="0.01" required>

                <button class="add-button" type="submit">Add New Car</button>

            </form>
        </div>



    </div>
    <script src="./scripts/admin-page.js"></script>
    
</body>
</html>
